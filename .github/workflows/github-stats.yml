name: GitHub Custom Stats

on:
  schedule:
    - cron: "0 */6 * * *"

  workflow_dispatch:

  push:
    branches:
      - main

concurrency:
  group: github-profile-updates
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  generate-stats:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate GitHub stats
        env:
          GITHUB_TOKEN: ${{ secrets.METRICS_TOKEN }}
          GITHUB_USERNAME: vijay-rodge
        run: |
          python3 - <<'PY'
          import os
          import json
          import re
          import urllib.request
          from datetime import date, timedelta

          TOKEN = os.environ["GITHUB_TOKEN"]
          USERNAME = os.environ["GITHUB_USERNAME"]

          # ============================================================
          # 1. Get normal GitHub API data
          # ============================================================

          query = """
          query($login: String!) {
            user(login: $login) {
              login
              name

              followers {
                totalCount
              }

              repositories(
                first: 100
                ownerAffiliations: OWNER
                privacy: PUBLIC
                isFork: false
              ) {
                totalCount
                nodes {
                  stargazerCount
                }
              }

              contributionsCollection {
                contributionCalendar {
                  totalContributions

                  weeks {
                    contributionDays {
                      date
                      contributionCount
                    }
                  }
                }
              }
            }
          }
          """

          payload = json.dumps({
              "query": query,
              "variables": {
                  "login": USERNAME
              }
          }).encode()

          request = urllib.request.Request(
              "https://api.github.com/graphql",
              data=payload,
              headers={
                  "Authorization": f"Bearer {TOKEN}",
                  "Content-Type": "application/json",
                  "User-Agent": USERNAME
              }
          )

          with urllib.request.urlopen(request) as response:
              data = json.load(response)

          if "errors" in data:
              print(json.dumps(data["errors"], indent=2))
              raise SystemExit("GitHub GraphQL request failed")

          user = data["data"]["user"]

          repos = user["repositories"]["nodes"]

          stars = sum(
              repo["stargazerCount"]
              for repo in repos
          )

          followers = user["followers"]["totalCount"]

          public_repos = user["repositories"]["totalCount"]

          calendar = (
              user["contributionsCollection"]
              ["contributionCalendar"]
          )

          # ============================================================
          # 2. Get contribution count from GitHub contribution graph
          # ============================================================

          contributions_url = (
              f"https://github.com/users/{USERNAME}/contributions"
          )

          contributions_request = urllib.request.Request(
              contributions_url,
              headers={
                  "User-Agent": "Mozilla/5.0",
                  "Accept": "image/svg+xml,text/html"
              }
          )

          with urllib.request.urlopen(contributions_request) as response:
              contribution_graph = response.read().decode(
                  "utf-8",
                  errors="ignore"
              )

          counts = re.findall(
              r'data-count="(\d+)"',
              contribution_graph
          )

          if not counts:
              raise SystemExit(
                  "Could not find contribution data from GitHub graph"
              )

          contributions = sum(
              int(count)
              for count in counts
          )

          # ============================================================
          # 3. Contribution days from GraphQL
          # Used for streak calculation
          # ============================================================

          days = []

          for week in calendar["weeks"]:
              for day in week["contributionDays"]:
                  days.append({
                      "date": day["date"],
                      "count": day["contributionCount"]
                  })

          days.sort(key=lambda x: x["date"])

          # ============================================================
          # 4. Current streak
          # ============================================================

          current_streak = 0
          check_date = date.today()

          day_map = {
              date.fromisoformat(d["date"]): d["count"]
              for d in days
          }

          if day_map.get(check_date, 0) == 0:
              check_date -= timedelta(days=1)

          while day_map.get(check_date, 0) > 0:
              current_streak += 1
              check_date -= timedelta(days=1)

          # ============================================================
          # 5. Longest streak
          # ============================================================

          longest_streak = 0
          running = 0

          for d in days:
              if d["count"] > 0:
                  running += 1
                  longest_streak = max(
                      longest_streak,
                      running
                  )
              else:
                  running = 0

          # ============================================================
          # 6. Print values
          # ============================================================

          print("Username:", USERNAME)
          print("Stars:", stars)
          print("Public repositories:", public_repos)
          print("Followers:", followers)
          print("Contributions (GitHub graph):", contributions)
          print("Current streak:", current_streak)
          print("Longest streak:", longest_streak)

          # ============================================================
          # 7. Generate SVG
          # ============================================================

          os.makedirs("assets", exist_ok=True)

          svg = f'''<svg xmlns="http://www.w3.org/2000/svg"
          width="850" height="310" viewBox="0 0 850 310">

          <rect width="850" height="310" rx="14"
                fill="#0d1117"
                stroke="#30363d"/>

          <text x="35" y="45"
                fill="#58a6ff"
                font-family="Arial, sans-serif"
                font-size="22"
                font-weight="bold">
            {USERNAME}
          </text>

          <text x="760" y="45"
                text-anchor="end"
                fill="#8b949e"
                font-family="Arial, sans-serif"
                font-size="13">
            at a glance
          </text>

          <line x1="35" y1="65" x2="815" y2="65"
                stroke="#30363d"/>

          <!-- Row 1 -->

          <text x="45" y="105"
                fill="#f0f6fc"
                font-family="Arial, sans-serif"
                font-size="25"
                font-weight="bold">
            {stars}
          </text>

          <text x="45" y="128"
                fill="#8b949e"
                font-family="Arial, sans-serif"
                font-size="13">
            Total stars
          </text>

          <text x="300" y="105"
                fill="#f0f6fc"
                font-family="Arial, sans-serif"
                font-size="25"
                font-weight="bold">
            {public_repos}
          </text>

          <text x="300" y="128"
                fill="#8b949e"
                font-family="Arial, sans-serif"
                font-size="13">
            Public repos
          </text>

          <text x="555" y="105"
                fill="#f0f6fc"
                font-family="Arial, sans-serif"
                font-size="25"
                font-weight="bold">
            {followers}
          </text>

          <text x="555" y="128"
                fill="#8b949e"
                font-family="Arial, sans-serif"
                font-size="13">
            Followers
          </text>

          <!-- Row 2 -->

          <text x="45" y="190"
                fill="#f0f6fc"
                font-family="Arial, sans-serif"
                font-size="25"
                font-weight="bold">
            {contributions}
          </text>

          <text x="45" y="213"
                fill="#8b949e"
                font-family="Arial, sans-serif"
                font-size="13">
            Contributions (1y)
          </text>

          <text x="300" y="190"
                fill="#f0f6fc"
                font-family="Arial, sans-serif"
                font-size="25"
                font-weight="bold">
            {current_streak}
          </text>

          <text x="300" y="213"
                fill="#8b949e"
                font-family="Arial, sans-serif"
                font-size="13">
            Current streak
          </text>

          <text x="555" y="190"
                fill="#f0f6fc"
                font-family="Arial, sans-serif"
                font-size="25"
                font-weight="bold">
            {longest_streak}
          </text>

          <text x="555" y="213"
                fill="#8b949e"
                font-family="Arial, sans-serif"
                font-size="13">
            Longest streak
          </text>

          <line x1="35" y1="240" x2="815" y2="240"
                stroke="#30363d"/>

          <text x="45" y="270"
                fill="#8b949e"
                font-family="Arial, sans-serif"
                font-size="14">
            GitHub activity • Automatically updated
          </text>

          </svg>'''

          with open(
              "assets/github-stats.svg",
              "w",
              encoding="utf-8"
          ) as f:
              f.write(svg)

          print("Created assets/github-stats.svg")
          PY

      - name: Commit stats
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add assets/github-stats.svg

          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update GitHub stats"
            git push
          fi